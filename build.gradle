plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'org.jetbrains.kotlin.jvm'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

        arguments '--width', '1708', '--height', '960'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java

            artifactId = mod_id

            pom {
                name = mod_name
                description = 'A high-performance server-authoritative particle effects library for NeoForge.'
                url = 'https://github.com/NekoWs/ParticleDrawing'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'NekoWs'
                        name = 'NekoWs'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/NekoWs/ParticleDrawing.git'
                    developerConnection = 'scm:git:ssh://git@github.com/NekoWs/ParticleDrawing.git'
                    url = 'https://github.com/NekoWs/ParticleDrawing'
                }
            }
        }
    }
    repositories {
        // 本地测试仓库
        maven {
            name = 'local'
            url = file("${project.projectDir}/repo")
        }
        // Maven Central（Central Portal publisher API）
        maven {
            name = 'central'
            url = uri('https://central.sonatype.com/api/v1/publisher')
            credentials {
                username = System.getenv('MAVEN_CENTRAL_USERNAME') ?: findProperty('centralUsername')
                password = System.getenv('MAVEN_CENTRAL_TOKEN') ?: findProperty('centralPassword')
            }
        }
    }
}

signing {
    def signingKey = findProperty('signingKey')
    if (signingKey != null && !signingKey.toString().trim().isEmpty()) {
        useGpgCmd()
        def pass = findProperty('signingPassword')?.toString()
        if (pass != null && !pass.isEmpty()) {
            password.set(pass)
        }
        sign publishing.publications.mavenJava
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
kotlin {
    jvmToolchain(25)
}
