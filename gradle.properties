org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.101

mod_id=particledrawing
mod_name=ParticleDrawing
mod_license=Apache-2.0
mod_version=1.0.28-ALPHA
mod_group_id=work.nekow

# 所有 sourceSet 在共享构建规则中显式归入同一模组。
neogradle.subsystems.conventions.sourcesets.automatic-inclusion=false
# CI 里同时装了 JDK 21 与 25，让 Gradle 按 target.properties 的 java_version 选工具链。
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
