name: Build

on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build platform-independent core
        run: ./gradlew -p shared/core build --console=plain

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: neoforge-26.2
            java: '25'
          - target: neoforge-26.3
            java: '25'
          - target: neoforge-1.21.1
            java: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew -p platforms/${{ matrix.target }} build --console=plain

      - name: Run required GameTests
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          ./gradlew -p platforms/${{ matrix.target }} runGameTestServer --console=plain 2>&1 | tee "$test_log"
          if ! grep -Eq '\[minecraft/GameTestServer\]: All [1-9][0-9]* required tests passed' "$test_log"; then
            echo "::error::GameTest server did not report a successful run of required tests"
            exit 1
          fi
