name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (v<mod_version>)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check version and generate release notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "ERROR: invalid version tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          PROP_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          MOD_ID="$(sed -n 's/^mod_id=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$VERSION" != "$PROP_VERSION" ]; then
            echo "ERROR: tag=$VERSION does not match mod_version=$PROP_VERSION" >&2
            exit 1
          fi
          if [[ ! "$MOD_ID" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "ERROR: invalid mod_id: $MOD_ID" >&2
            exit 1
          fi
          case "${VERSION^^}" in
            *ALPHA*|*BETA*|*RC*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          PREV_TAG="$(git describe --tags --abbrev=0 --exclude "$RELEASE_TAG" "$RELEASE_TAG^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --no-merges --pretty=format:'- %s' "$PREV_TAG..$RELEASE_TAG" > changelog.md
          else
            git log --no-merges --pretty=format:'- %s' -20 "$RELEASE_TAG" > changelog.md
          fi
          echo >> changelog.md
          {
            echo "version=$VERSION"
            echo "artifact=$MOD_ID-$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain

      - name: Publish release and attach artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          test -s "build/libs/$ARTIFACT.jar"
          test -s "build/libs/$ARTIFACT-sources.jar"
          (
            cd build/libs
            sha256sum "$ARTIFACT.jar" "$ARTIFACT-sources.jar" > SHA256SUMS
          )
          ASSETS=("build/libs/$ARTIFACT.jar" "build/libs/$ARTIFACT-sources.jar" "build/libs/SHA256SUMS")
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            FLAGS=()
            if [ "$PRERELEASE" = true ]; then
              FLAGS+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --verify-tag --draft --title "ParticleDrawing $VERSION" \
              --notes-file changelog.md "${FLAGS[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
