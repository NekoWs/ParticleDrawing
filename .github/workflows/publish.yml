name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag 名就是发布版本号，写错会发出与源码版本对不上的坐标，所以先挡住
      - name: Check tag matches mod_version
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          echo "tag=$TAG_VERSION  gradle.properties=$PROP_VERSION"
          if [ -z "$PROP_VERSION" ]; then
            echo "ERROR: gradle.properties 里没有 mod_version" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "ERROR: 标签名与 mod_version 不一致（tag=$TAG_VERSION, mod_version=$PROP_VERSION）：请在改版本号的那个提交上打 v<mod_version> 标签。" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Import GPG key and unlock
        run: |
          set -e
          GNUPGHOME="$(mktemp -d /tmp/gnupg-XXXXXX)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf 'pinentry-mode loopback\nuse-agent\n' > "$GNUPGHOME/gpg.conf"
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 900\nmax-cache-ttl 3600\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo '=== list-secret-keys ==='
          gpg --batch --list-secret-keys --keyid-format LONG
          KEY_ID=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="sec" {print $5; exit}')
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --batch --with-colons --list-keys | awk -F: '$1=="pub" {print $5; exit}')
          fi
          echo "Resolved KEY_ID=[$KEY_ID]"
          if [ -z "$KEY_ID" ]; then
            echo "ERROR: could not resolve GPG key id" >&2
            exit 1
          fi
          echo "default-key $KEY_ID" >> "$GNUPGHOME/gpg.conf"
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "unlock" | gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$KEY_ID" --armor --sign --output /dev/null
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral -Pmod_version="${GITHUB_REF_NAME#v}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
