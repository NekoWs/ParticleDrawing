name: Publish to Modrinth

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  modrinth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # tag 名就是发布版本号；与 publish.yml 用同一条守卫，写错就别发
      - name: Read version metadata
        id: meta
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$VERSION" != "$PROP_VERSION" ]; then
            echo "ERROR: 标签名与 mod_version 不一致（tag=$VERSION, mod_version=$PROP_VERSION）：请在改版本号的那个提交上打 v<mod_version> 标签。" >&2
            exit 1
          fi
          case "$VERSION" in
            *ALPHA*) TYPE=alpha ;;
            *BETA*)  TYPE=beta ;;
            *)       TYPE=release ;;
          esac
          PREV_TAG="$(git describe --tags --abbrev=0 --exclude "$GITHUB_REF_NAME" "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --no-merges --pretty=format:'- %s' "$PREV_TAG..$GITHUB_REF_NAME" > changelog.md
          else
            git log --no-merges --pretty=format:'- %s' -20 > changelog.md
          fi
          echo >> changelog.md
          {
            echo "version=$VERSION"
            echo "type=$TYPE"
            echo "game_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '[:space:]')"
          } >> "$GITHUB_OUTPUT"

      - name: Build jar
        run: ./gradlew build

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ParticleDrawing ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: changelog.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.game_version }}
          modrinth-id: particledrawing
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          fail-mode: fail

      # mc-publish 只管版本，项目正文要另外 PATCH；正文以 README 为准
      - name: Sync README to project body
        run: |
          set -e
          jq -Rs '{body: .}' README.md > body.json
          curl -fsS -X PATCH "https://api.modrinth.com/v2/project/particledrawing" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @body.json > /dev/null
          echo "已把 README 同步到 Modrinth 项目正文"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
