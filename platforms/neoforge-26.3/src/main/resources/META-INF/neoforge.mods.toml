
license="${mod_license}"

issueTrackerURL="https://github.com/NekoWs/ParticleDrawing/issues" #optional

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

displayURL="https://github.com/NekoWs/ParticleDrawing" #optional

iconFile="icon.png" #optional

#credits="" #optional

authors="NekoWs"

description='''
A high-performance particle animation library.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Sodium 兼容（未安装 Sodium 时由配置插件跳过整组 mixin）。
[[mixins]]
config="${mod_id}.sodium.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Sodium 兼容是可选的：装了才应用 sodium mixin，版本区间与已验证的 Sodium 对齐。
[[dependencies.${mod_id}]]
    modId="sodium"
    type="optional"
    versionRange="[0.6.0,)"
    ordering="NONE"
    side="CLIENT"

