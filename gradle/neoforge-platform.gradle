
// 模组属性与目标版本分开维护，各适配器共用这一份构建规则。
def repositoryRoot = project.ext.pdrawRepositoryRoot as File
def targetName = project.ext.pdrawTarget as String
def modProperties = new Properties()
file("$repositoryRoot/gradle.properties").withInputStream { modProperties.load(it) }
['mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_group_id'].each { key ->
    project.ext.set(key, modProperties.getProperty(key))
}
def targetProperties = new Properties()
file("$repositoryRoot/platforms/$targetName/target.properties").withInputStream { targetProperties.load(it) }
['minecraft_version', 'minecraft_version_range', 'neo_version'].each { key ->
    project.ext.set(key, targetProperties.getProperty(key))
}
def commonSource = new File(repositoryRoot, 'platforms/neoforge-common/src')
def targetSource = new File(repositoryRoot, "platforms/$targetName/src")
def generatedResources = new File(targetSource, 'generated/resources')
sourceSets {
    main {
        kotlin.setSrcDirs([new File(commonSource, 'main/kotlin'), new File(targetSource, 'main/kotlin')])
        java.setSrcDirs([new File(commonSource, 'main/java'), new File(targetSource, 'main/java')])
        resources.setSrcDirs([new File(commonSource, 'main/resources'), new File(targetSource, 'main/resources'), generatedResources])
    }
    test {
        kotlin.setSrcDirs([new File(commonSource, 'test/kotlin'), new File(targetSource, 'test/kotlin')])
        java.setSrcDirs([new File(commonSource, 'test/java'), new File(targetSource, 'test/java')])
        resources.setSrcDirs([new File(commonSource, 'test/resources'), new File(targetSource, 'test/resources')])
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
repositories {
    mavenCentral()
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()

tasks.withType(Test).configureEach {
    workingDir repositoryRoot
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        // Windows 控制台默认 GBK，println 的中文会乱码；统一按 UTF-8 输出。
        systemProperty 'file.encoding', 'UTF-8'
        systemProperty 'stdout.encoding', 'UTF-8'
        systemProperty 'stderr.encoding', 'UTF-8'

        workingDirectory project.layout.dir(providers.provider { new File(repositoryRoot, "run/$targetName/$name") })

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

        arguments '--width', '1708', '--height', '960'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', generatedResources.absolutePath,
                '--existing', new File(commonSource, 'main/resources').absolutePath
    }
}

configurations {
    coreBundle { transitive = false }
    runtimeClasspath.extendsFrom localRuntime
    runtimeClasspath.extendsFrom coreBundle
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly project(':pdraw-core')
    coreBundle project(':pdraw-core')
    testImplementation project(':pdraw-core')
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation(testFixtures(project(':pdraw-core')))
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

signing {
    useGpgCmd()
}

mavenPublishing {
    if (findProperty('signingKey') != null && !findProperty('signingKey').toString().trim().isEmpty()) {
        signAllPublications()
    }

    coordinates(mod_group_id, "${mod_id}-neoforge-${minecraft_version}", mod_version)

    pom {
        name = mod_name
        description = 'A high-performance server-authoritative particle effects library for NeoForge.'
        url = 'https://github.com/NekoWs/ParticleDrawing'
        licenses {
            license {
                name = 'Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'NekoWs'
                name = 'NekoWs'
            }
        }
        scm {
            connection = 'scm:git:https://github.com/NekoWs/ParticleDrawing.git'
            developerConnection = 'scm:git:ssh://git@github.com/NekoWs/ParticleDrawing.git'
            url = 'https://github.com/NekoWs/ParticleDrawing'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
kotlin {
    jvmToolchain(25)
}

// 发布的模组包含同一次构建的核心，用户只需安装对应游戏版本的一个 JAR。
tasks.named('jar', Jar) {
    dependsOn ':pdraw-core:jar'
    from({ configurations.coreBundle.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}
tasks.named('sourcesJar') { from(project(':pdraw-core').file('src/main/kotlin')) }
tasks.named('test') { dependsOn ':pdraw-core:test' }
tasks.named('cleanTest') { dependsOn ':pdraw-core:cleanTest' }
tasks.named('check') { dependsOn ':pdraw-core:check' }

tasks.register('verifyPackagedCore') {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        def archive = new java.util.zip.ZipFile(tasks.named('jar', Jar).get().archiveFile.get().asFile)
        try {
            [
                'work/nekow/particledrawing/animation/ClientAnimationPlayer.class',
                'work/nekow/particledrawing/animation/PdrawcReader.class',
                'work/nekow/particledrawing/animation/recipe/RecipeRuntime.class',
                'work/nekow/particledrawing/math/Vec3.class',
                'work/nekow/particledrawing/platform/audio/StbOggReader.class',
                'META-INF/services/work.nekow.particledrawing.animation.script.ScriptWavePcm$OggReader',
            ].each { path ->
                if (archive.getEntry(path) == null) throw new GradleException("模组 JAR 缺少核心或宿主实现: $path")
            }
        } finally { archive.close() }
    }
}
tasks.named('check') { dependsOn 'verifyPackagedCore' }

tasks.register('verifyPublishedDependencies') {
    dependsOn { tasks.named('generatePomFileForMavenPublication') }
    doLast {
        def pom = layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile.getText('UTF-8')
        if (pom =~ /<artifactId>\s*pdraw-core\s*<\/artifactId>/) {
            throw new GradleException('核心已经内嵌，发布 POM 不应依赖未单独发布的 pdraw-core')
        }
    }
}
tasks.named('check') { dependsOn 'verifyPublishedDependencies' }
