
// 模组属性与目标版本分开维护，各适配器共用这一份构建规则。
def repositoryRoot = project.ext.pdrawRepositoryRoot as File
def targetName = project.ext.pdrawTarget as String
def modProperties = new Properties()
file("$repositoryRoot/gradle.properties").withInputStream { modProperties.load(it) }
['mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_group_id'].each { key ->
    project.ext.set(key, modProperties.getProperty(key))
}
def targetProperties = new Properties()
file("$repositoryRoot/platforms/$targetName/target.properties").withInputStream { targetProperties.load(it) }
['minecraft_version', 'minecraft_version_range', 'neo_version'].each { key ->
    project.ext.set(key, targetProperties.getProperty(key))
}
// 各目标自己声明构建用的 JDK：26.x 用 25，1.21.1 用 21。缺省保持 25。
def javaVersion = targetProperties.getProperty('java_version', '25') as int
project.ext.set('java_version', javaVersion)
def commonSource = new File(repositoryRoot, 'platforms/neoforge-common/src')
def targetSource = new File(repositoryRoot, "platforms/$targetName/src")
def generatedResources = new File(targetSource, 'generated/resources')
// 目标可以在共享树里整份替换个别文件（1.21.1 的渲染与贴图要用另一代 API 重写）。
// 只排除共享目录里的那一份：目标目录里的同名文件照常参与编译。
//
// 两个属性分开，是因为它们语义不同：
// - shared_replacements：共享那份被目标版本自己的实现替代，所以目标里必须有同名文件。
// - shared_exclusions：这一版根本不需要这个文件（例如只服务另一代渲染管线），共享那份直接不编。
// 混在一起时，漏写或删掉目标是静默的：共享文件被排除、又没有替代品，类和测试就这么消失了。
def replacedPaths = (targetProperties.getProperty('shared_replacements', '') ?: '')
        .split(',').collect { it.trim() }.findAll { it }
def excludedOnlyPaths = (targetProperties.getProperty('shared_exclusions', '') ?: '')
        .split(',').collect { it.trim() }.findAll { it }
def existsInTarget = { String relative ->
    ['main/kotlin', 'main/java', 'test/kotlin', 'test/java'].any { sub ->
        new File(targetSource, "$sub/$relative").isFile()
    }
}
def missingReplacements = replacedPaths.findAll { !existsInTarget(it) }
if (!missingReplacements.isEmpty()) {
    throw new GradleException(
        "shared_replacements 里的文件在 platforms/$targetName/src 中不存在：${missingReplacements.join(', ')}。" +
            "如果这一版确实不需要该文件，请改写到 shared_exclusions。"
    )
}
def replacedOrExcluded = replacedPaths + excludedOnlyPaths
if (!replacedOrExcluded.isEmpty()) {
    def excluded = [] as Set
    ['main/kotlin', 'main/java', 'test/kotlin', 'test/java'].each { sub ->
        def root = new File(commonSource, sub).absolutePath + File.separator
        replacedOrExcluded.each { excluded.add(root + it.replace('/', java.io.File.separator)) }
    }
    [sourceSets.main.kotlin, sourceSets.main.java, sourceSets.test.kotlin, sourceSets.test.java].each { set ->
        set.exclude { element -> excluded.contains(element.file.absolutePath) }
    }
    // allSource 不继承上面的排除，sourcesJar 会把共享与目标两份同名文件都打进去，这里单独排一次。
    tasks.matching { it.name == 'sourcesJar' }.configureEach {
        exclude { element -> excluded.contains(element.file.absolutePath) }
    }
}

// 1.21.1 用类型别名桥接两代 API 的命名（Identifier / BlockAndLightGetter）。
// 别名在使用点就被擦除，没有运行期引用，但 Kotlin 仍会为别名文件生成空 facade 类，
// 这些类会把 net.minecraft.* 包带进模组模块，FML 解析模块层时会报包冲突。编译后删掉即可。
if (targetProperties.getProperty('drop_alias_facades', '') == 'true') {
    tasks.named('compileKotlin').configure {
        // 编译后会删掉别名 facade，增量编译不能复用这份输出。
        incremental = false
        doFirst {
            // 上一轮拷进输出目录的标准库类会被下一次增量编译当成类路径来源，先清掉保证编译起点干净。
            def stale = new File(destinationDirectory.get().asFile, 'kotlin')
            if (stale.exists()) delete stale
        }
        doLast {
            def classesDir = destinationDirectory.get().asFile
            def facades = new File(classesDir, 'net/minecraft')
            if (facades.exists()) delete facades
            // 标准库并入同一个类目录：开发运行的模组文件就是这个目录，kotlin 包因此属于模组自己的模块，
            // 不依赖模块层对 classpath 的可见性；打包时同样随 classes 进 JAR。
            def stdlib = project.configurations.findByName('kotlinStdlib121')
            stdlib?.files?.each { zipFile ->
                // 直接读 ZIP：Gradle 的 zipTree 在 doLast 里展开缓存中的 jar 会报 Cannot expand ZIP
                new java.util.zip.ZipFile(zipFile).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (!entry.directory && entry.name.startsWith('kotlin/')) {
                            def target = new File(classesDir, entry.name)
                            target.parentFile.mkdirs()
                            zip.getInputStream(entry).withCloseable { input ->
                                target.withOutputStream { out -> input.transferTo(out) }
                            }
                        }
                    }
                }
            }
        }
    }
    tasks.named('jar').configure {
        exclude 'net/minecraft/**'
    }
}

// 核心源码已经通过上面的 srcDirs 并进主源集，不再跨项目引用 :pdraw-core 的 sourceSet：
// Gradle 9 会在配置期无锁解析对方配置而报错，Gradle 10 也不再允许。
def dataRunName = targetProperties.getProperty('data_run', 'clientData')
sourceSets {
    main {
        // 核心源码也并进主源集：开发运行时核心类必须和平台同属一个模组模块，
        // 否则 FML 的模块看不到它们（ClassNotFoundException）。
        kotlin.setSrcDirs([
                new File(repositoryRoot, 'shared/core/src/main/kotlin'),
                new File(commonSource, 'main/kotlin'),
                new File(targetSource, 'main/kotlin'),
        ])
        java.setSrcDirs([new File(commonSource, 'main/java'), new File(targetSource, 'main/java')])
        if (project.hasProperty('pdCaptureDir')) {
            def captureSources = new File(repositoryRoot, 'tools/framebuffer-capture')
            java.srcDir(new File(captureSources, 'common'))
            java.srcDir(new File(captureSources, targetProperties.getProperty('minecraft_version') == '1.21.1' ? 'legacy' : 'modern'))
        }
        resources.setSrcDirs([
                new File(repositoryRoot, 'shared/core/src/main/resources'),
                new File(commonSource, 'main/resources'),
                new File(targetSource, 'main/resources'),
                generatedResources,
        ])
    }
    test {
        kotlin.setSrcDirs([new File(commonSource, 'test/kotlin'), new File(targetSource, 'test/kotlin')])
        java.setSrcDirs([new File(commonSource, 'test/java'), new File(targetSource, 'test/java')])
        resources.setSrcDirs([new File(commonSource, 'test/resources'), new File(targetSource, 'test/resources')])
    }
}

// GameTest 源集：共享层放三端通用的契约测试，平台目录只放版本特有的一份（可缺省）。
// 之前只在 1.21.1 建了这个目录，26.x 的 runGameTestServer 实际只跑到框架自带的测试，
// CI 的「All N required tests passed」在三端是假门禁。
def gameTestCommon = new File(commonSource, 'gameTest')
def gameTestTarget = new File(targetSource, 'gameTest')
if (gameTestCommon.isDirectory() || gameTestTarget.isDirectory()) {
    sourceSets.create('gameTest') {
        java.setSrcDirs([new File(gameTestCommon, 'java'), new File(gameTestTarget, 'java')])
        resources.setSrcDirs([new File(gameTestCommon, 'resources'), new File(gameTestTarget, 'resources')])
    }
    configurations.gameTestImplementation.extendsFrom(configurations.implementation)
    project.ext.hasGameTests = true
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
repositories {
    mavenCentral()
}

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
java.withSourcesJar()

tasks.withType(Test).configureEach {
    workingDir repositoryRoot
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        // Windows 控制台默认 GBK，println 的中文会乱码；统一按 UTF-8 输出。
        systemProperty 'file.encoding', 'UTF-8'
        systemProperty 'stdout.encoding', 'UTF-8'
        systemProperty 'stderr.encoding', 'UTF-8'

        workingDirectory project.layout.dir(providers.provider { new File(repositoryRoot, "run/$targetName/$name") })

        // 核心与平台共用包，开发运行时也必须归入同一个模组，避免模块加载隔离。
        modSources {
            add(project.mod_id, project.sourceSets.main)
        }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        if (project.hasProperty('pdBackgroundCapture') || project.hasProperty('pdCaptureDir')) {
            systemProperty 'pd.backgroundCapture', 'true'
            if (targetProperties.getProperty('minecraft_version') == '26.3') {
                environmentVariables.put('SDL_WINDOW_ACTIVATE_WHEN_SHOWN', '0')
                environmentVariables.put('SDL_WINDOW_ACTIVATE_WHEN_RAISED', '0')
            }
        }
        if (project.hasProperty('pdCaptureDir')) {
            systemProperty 'pd.capture.directory', project.file(project.property('pdCaptureDir')).absolutePath
        }
        if (project.hasProperty('pdCaptureIntervalMs')) {
            systemProperty 'pd.capture.intervalMs', project.property('pdCaptureIntervalMs').toString()
        }

        arguments '--width', '1708', '--height', '960'
        // 验收用的直入钩子：不传属性时完全惰性，不影响正常启动。
        // -PpdQuickPlay=<存档名> 直接进单人世界；-PpdQuickConnect=<地址> 直连服务器。
        if (project.hasProperty('pdQuickPlay')) {
            arguments '--quickPlaySingleplayer', project.property('pdQuickPlay').toString()
        }
        if (project.hasProperty('pdQuickConnect')) {
            arguments '--quickPlayMultiplayer', project.property('pdQuickConnect').toString()
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // -PpdSelfTest 让服务端启动后跑一遍对外 API 自检，三端共用同一份断言。
        if (project.hasProperty('pdSelfTest')) {
            systemProperty 'pd.selftest', '1'
        }
    }

    // 数据生成运行名随 NeoGradle 版本变化：26.x 是 clientData，1.21.1 是 data
    if (dataRunName == 'data') {
        data {
            arguments.addAll '--mod', project.mod_id, '--all', '--output', generatedResources.absolutePath,
                    '--existing', new File(commonSource, 'main/resources').absolutePath
        }
    } else {
        clientData {
            arguments.addAll '--mod', project.mod_id, '--all', '--output', generatedResources.absolutePath,
                    '--existing', new File(commonSource, 'main/resources').absolutePath
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// 1.21.1 把 Kotlin 标准库并入模组类输出，见 compileKotlin 的 doLast。
def bundleKotlin = targetProperties.getProperty('bundle_kotlin', '') == 'true'
if (bundleKotlin) {
    configurations { kotlinStdlib121 { transitive = false } }
    dependencies { kotlinStdlib121 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10' }
}

def jarJarKotlin = targetProperties.getProperty('jarjar_kotlin', '') == 'true'

// 26.x 的 FML 不自带 Kotlin 运行时：漏掉内嵌标记会打出启动即 NoClassDefFoundError 的 JAR。
if (!jarJarKotlin && !bundleKotlin && (targetProperties.getProperty('minecraft_version', '') ?: '').startsWith('26.')) {
    throw new GradleException("26.x 目标必须在 target.properties 声明 jarjar_kotlin=true（缺少 Kotlin 运行时会启动崩溃）")
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    if (jarJarKotlin) {
        jarJar('org.jetbrains.kotlin:kotlin-stdlib:[2.4.10,3)') {
            version { prefer '2.4.10' }
        }
    }
    compileOnly project(':pdraw-core')
    testImplementation project(':pdraw-core')
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation(testFixtures(project(':pdraw-core')))
}


if (findProperty('hasGameTests') != null) {
    // GameTest 与模组共用 NeoForge 运行时。
    def gameTests = sourceSets.gameTest
    gameTests.extensions.getByName('runtimeDefinition').set(sourceSets.main.extensions.getByName('runtimeDefinition'))
    gameTests.compileClasspath += sourceSets.main.output
    runs.gameTestServer.modSources.add(mod_id, gameTests)
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

signing {
    useGpgCmd()
}

mavenPublishing {
    if (findProperty('signingKey') != null && !findProperty('signingKey').toString().trim().isEmpty()) {
        signAllPublications()
    }

    coordinates(mod_group_id, "${mod_id}-neoforge-${minecraft_version}", mod_version)

    pom {
        name = mod_name
        description = 'A high-performance server-authoritative particle effects library for NeoForge.'
        url = 'https://github.com/NekoWs/ParticleDrawing'
        licenses {
            license {
                name = 'Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'NekoWs'
                name = 'NekoWs'
            }
        }
        scm {
            connection = 'scm:git:https://github.com/NekoWs/ParticleDrawing.git'
            developerConnection = 'scm:git:ssh://git@github.com/NekoWs/ParticleDrawing.git'
            url = 'https://github.com/NekoWs/ParticleDrawing'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
kotlin {
    jvmToolchain(javaVersion)
}

// 发布的模组包含同一次构建的核心，用户只需安装对应游戏版本的一个 JAR。
// 核心源码已经并入主源集，类直接来自编译输出，不再从核心 JAR 解包（否则同类重复）。
tasks.named('jar', Jar) {
    dependsOn ':pdraw-core:jar'
}
// 核心源码已经在主源集的 srcDirs 里，sourcesJar 不再单独加一次，否则条目重复。
tasks.named('test') { dependsOn ':pdraw-core:test' }
tasks.named('cleanTest') { dependsOn ':pdraw-core:cleanTest' }
tasks.named('check') { dependsOn ':pdraw-core:check' }

def modJar = tasks.named(jarJarKotlin ? 'jarJar' : 'jar', Jar)
if (jarJarKotlin) {
    // 发布流程与 Maven 消费者都使用包含标准库的主 JAR。
    tasks.named('jar', Jar) { destinationDirectory = layout.buildDirectory.dir('intermediates/jar') }
    modJar.configure { archiveClassifier.set('') }
    configurations.named('apiElements') {
        outgoing.artifacts.clear()
        outgoing.artifact(modJar)
    }
}

tasks.register('verifyPackagedCore') {
    dependsOn modJar
    inputs.file(modJar.flatMap { it.archiveFile })
    doLast {
        def archive = new java.util.zip.ZipFile(modJar.get().archiveFile.get().asFile)
        try {
            [
                'work/nekow/particledrawing/animation/ClientAnimationPlayer.class',
                'work/nekow/particledrawing/animation/PdrawcReader.class',
                'work/nekow/particledrawing/animation/recipe/RecipeRuntime.class',
                'work/nekow/particledrawing/math/Vec3.class',
                'work/nekow/particledrawing/platform/audio/StbOggReader.class',
                'META-INF/services/work.nekow.particledrawing.animation.script.ScriptWavePcm$OggReader',
            ].each { path ->
                if (archive.getEntry(path) == null) throw new GradleException("模组 JAR 缺少核心或宿主实现: $path")
            }
            if (jarJarKotlin) {
                def metadataEntry = archive.getEntry('META-INF/jarjar/metadata.json')
                if (metadataEntry == null) throw new GradleException('模组 JAR 缺少 Jar-in-Jar 元数据')
                def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(metadataEntry))
                def stdlib = metadata.jars.find {
                    it.identifier.group == 'org.jetbrains.kotlin' && it.identifier.artifact == 'kotlin-stdlib'
                }
                if (stdlib == null || archive.getEntry(stdlib.path) == null) {
                    throw new GradleException('模组 JAR 缺少 Kotlin 标准库')
                }
            }
        } finally { archive.close() }
    }
}
tasks.named('check') { dependsOn 'verifyPackagedCore' }

tasks.register('verifyPublishedDependencies') {
    dependsOn { tasks.named('generatePomFileForMavenPublication') }
    doLast {
        def pom = layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile.getText('UTF-8')
        if (pom =~ /<artifactId>\s*pdraw-core\s*<\/artifactId>/) {
            throw new GradleException('核心已经内嵌，发布 POM 不应依赖未单独发布的 pdraw-core')
        }
    }
}
tasks.named('check') { dependsOn 'verifyPublishedDependencies' }
